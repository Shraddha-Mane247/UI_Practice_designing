<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BackgroundImage</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        width: 700px;
        height: 300px;
        margin: auto;
        border: 2px solid #000;
        background-image: linear-gradient(to bottom, orange, white, green);
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 50px;
      }
      .box img {
        width: 120px;
        height: 120px;
        animation-name: spin;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        transition: all 0s linear;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="box">
      <img src="./imgs/ashok_chakra.png" alt="AshokChakra" />
    </div>
  </body>
</html>
