<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background Origin property</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        width: 600px;
        min-height: 300px;
        border: 10px dashed black;
        background-repeat: no-repeat;
        margin: auto;
        background-image: url("./imgs/flowersbg.jpg");
        background-origin: border-box;
        padding: 50px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>This is background Origin Property</h1>
    </div>
  </body>
</html>
