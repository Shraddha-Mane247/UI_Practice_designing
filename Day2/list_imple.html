<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        margin: auto;
        padding: 10px;
        width: 500px;
        height: 450px;
        border: 1px solid black;
      }
      .box ul {
        padding: 20px;
        background-color: antiquewhite;
      }
      #java {
        font-size: 40px;
      }
      #python {
        font-size: 35px;
      }
      #c {
        font-size: 30px;
      }
      #cpp {
        font-size: 25px;
      }
      #net {
        font-size: 20px;
      }
      ul,
      li {
        padding: 10px;
        border: 1px solid #000;
      }
      .favourite {
        color: red;
        background-color: chartreuse;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <ul>
        <li id="java">Java</li>
        <li id="python">Python</li>
        <li id="c" class="favourite">C</li>
        <li id="cpp">C++</li>
        <li id="net">.Net</li>
      </ul>
    </div>
  </body>
</html>
