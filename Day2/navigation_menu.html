<!-- Assignment 4: College Website Navigation Menu
Problem Statement
Create a navigation menu containing:
•	Home 
•	About 
•	Courses 
•	Gallery 
•	Contact 
Display all menu items horizontally with a colored background.
Highlight the active menu item differently.
CSS Selector Suggestions
•	Element Selector (ul, li) 
•	Descendant Selector (ul li) 
•	Class Selector (.active) 
•	Pseudo-class Selector (li:hover)  -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        min-height: 300px;
        border: 1px solid black;
      }
      .header {
        background-color: black;
        display: inline-block;
        height: 90px;
        width: 100%;
      }
      .name {
        color: white;
        width: 50%;
        float: left;
        border: 1px solid white;
        line-height: 90px;
        padding-left: 20px;
      }
      .menu {
        color: white;
        width: 50%;
        float: right;
        border: 1px solid white;
      }
      ul li {
        display: inline-block;
        padding-left: 25px;
      }
      ul {
        list-style-type: none;
        line-height: 90px;
        margin-left: 200px;
      }
      ul li a {
        text-decoration: none;
        color: white;
      }
      .menu ul li:hover {
        content: "";
        background-color: rgb(66, 63, 63);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="name"><h1>NKOCET</h1></div>
        <div class="menu">
          <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Courses</a></li>
            <li><a href="">Gallery</a></li>
            <li><a href="">Contact Us</a></li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
