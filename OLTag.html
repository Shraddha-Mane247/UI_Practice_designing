<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 500px;
        min-height: 300px;
        border: 2px solid #000;
        margin: auto;
        padding: 10px;
        background-color: lavenderblush;
      }
      .box h1 {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Ordered List Tag</h1>
      <ol>
        <li>Mango</li>
        <li>Apple</li>
        <li>Grapes</li>
        <li>Banana</li>
        <li>Orange</li>
      </ol>
    </div>
  </body>
</html>
