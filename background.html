<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background properties</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        width: 700px;
        height: 300px;
        margin: auto;
        background-color: tomato;
        border: 4px solid black;
        margin-top: 20px;
      }
      .box h1 {
        text-align: center;
        color: #fff;
        line-height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Stay Consistancy is the key to Success..!</h1>
    </div>
  </body>
</html>
