<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        min-height: 550px;
        border: 1px solid #000;
        background-image: url("./imgs/smilingLady.png");
        background-size: cover;
        background-repeat: no-repeat;
      }
      .box {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .container .box img {
        width: 100%;
        height: 100%;
      }
      .child {
        width: 450px;
        height: 220px;
        border: 3px solid #ffff;
        position: absolute;
        top: 180px;
        left: 750px;
        padding: 10px;
        justify-content: center;
        padding-top: 30px;
        box-shadow: 7px 5px 8px 0px rgba(255, 255, 255);
      }
      .child h1 {
        color: white;
        font-weight: 100;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="child">
          <h1>
            "The expert in anything was once a beginner, and success is the sum
            of those small efforts repeated daily!"
          </h1>
        </div>
      </div>
    </div>
  </body>
</html>
