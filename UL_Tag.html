<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 500px;
        min-height: 300px;
        border: 2px solid #000;
        margin: auto;
        padding: 10px;
        background-color: antiquewhite;
      }
      .box h1 {
        color: purple;
      }
      .box ul {
        list-style-type: square;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Unordered List Tag</h1>
      <ul>
        <li>Pen</li>
        <li>Pencil</li>
        <li>Sharpner</li>
        <li>Eraser</li>
        <li>Scale</li>
        <li>Notebook</li>
      </ul>
    </div>
  </body>
</html>
