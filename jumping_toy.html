<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        width: 800px;
        height: 400px;
        border: 1px solid #000;
        margin: auto;
        margin-top: 30px;
        background-image: url(imgs/jumping_bg.jpg);
        background-size: 100%;
        position: relative;
        overflow: hidden;
      }
      .boy {
        width: 90px;
        position: absolute;
        left: 20px;
        bottom: 95px;
        animation: jump 8s linear infinite;
      }

      @keyframes jump {
        0% {
          left: 20px;
          bottom: 95px;
        }
        10% {
          left: 80px;
          bottom: 180px;
        }
        20% {
          left: 170px;
          bottom: 145px;
        }
        30% {
          left: 260px;
          bottom: 230px;
        }

        40% {
          left: 340px;
          bottom: 120px;
        }

        /* Jump to Platform 4 */
        50% {
          left: 430px;
          bottom: 210px;
        }

        60% {
          left: 510px;
          bottom: 150px;
        }

        /* Jump to Platform 5 */
        70% {
          left: 600px;
          bottom: 190px;
        }

        80% {
          left: 700px;
          bottom: 140px;
        }

        100% {
          left: 800px;
          bottom: 140px;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="./imgs/boy.png" alt="" class="boy" />
    </div>
  </body>
</html>
