<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Tags</title>
    <style>
      .box {
        width: 700px;
        min-height: 300px;
        padding: 10px;
        border: 2px solid #000;
        margin: auto;
        text-align: justify;
      }
      .box p {
        color: darkblue;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
      .box h1,
      h2 {
        color: brown;
        font-family: cursive;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Hi! This is Shraddha</h1>
      <h2>Html practice</h2>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quibusdam,
        sequi ipsa dolor facilis eius non ut odio modi dolores reprehenderit
        asperiores eaque necessitatibus aliquid sint, cupiditate aut reiciendis
        et quis.
      </p>
    </div>
  </body>
</html>
